# A release: when a tag v<version> is pushed, the tests run once more, the wheel and source archive are built and
# attached to a GitHub release. Sites install the wheel by its address there, with its hash in their uv.lock
# (docs/adr/0006-distribution.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.12
      - name: The tag is the version in pyproject.toml and in the package
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }
          grep -q "^__version__ = \"$version\"$" src/wts_core/__init__.py || { echo "wts_core.__version__ is not $version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Publish the release with the wheel and the source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed and what a site must do."
