# The family's toolchain in one step: uv and Python, and Node where a job needs it.
# Use it in a site's own job:   - uses: rj-mitchell/wts-core/.github/actions/setup@v0.3.1
name: Set up the Where They Stand toolchain
description: uv and Python at the family's versions, and Node if asked for.
inputs:
  python:
    description: Python version
    default: "3.12"
  uv:
    description: uv version
    default: "0.11.32"
  node:
    description: Node version; leave empty for a job that needs no Node
    default: ""
  node-cache-path:
    description: A package-lock.json to key npm's cache on (optional)
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.uv }}
        # The whole cache is saved as it is. With pruning on (the action's default), its last step runs
        # `uv cache prune --ci`, which waits for every other uv process to let go of the cache: a site left
        # running by `uv run <site> serve &` holds it, so the job waited five minutes at its end and then
        # failed, after its checks had passed (Where Countries Stand's accessibility job). The cache is larger
        # for it: the wheels uv downloaded are kept in it too. A job should still start a background site with
        # the environment's own program and stop it in a last step (docs/NEW-SITE.md, "CI").
        prune-cache: false
    - shell: bash
      run: uv python install ${{ inputs.python }}
    - if: inputs.node != '' && inputs.node-cache-path == ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node }}
    - if: inputs.node != '' && inputs.node-cache-path != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node }}
        cache: npm
        cache-dependency-path: ${{ inputs.node-cache-path }}
