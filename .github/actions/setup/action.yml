# The family's toolchain in one step: uv and Python, and Node where a job needs it.
# Use it in a site's own job:   - uses: rj-mitchell/wts-core/.github/actions/setup@v0.1.0
name: Set up the Where They Stand toolchain
description: uv and Python at the family's versions, and Node if asked for.
inputs:
  python:
    description: Python version
    default: "3.12"
  uv:
    description: uv version
    default: "0.11.32"
  node:
    description: Node version; leave empty for a job that needs no Node
    default: ""
  node-cache-path:
    description: A package-lock.json to key npm's cache on (optional)
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.uv }}
    - shell: bash
      run: uv python install ${{ inputs.python }}
    - if: inputs.node != '' && inputs.node-cache-path == ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node }}
    - if: inputs.node != '' && inputs.node-cache-path != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node }}
        cache: npm
        cache-dependency-path: ${{ inputs.node-cache-path }}
